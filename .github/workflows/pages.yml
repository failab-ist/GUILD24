# GitHub Pages deployment for GUILD24.
#
# The game is a static build with no compile step: dist/ is the shipped artifact exactly as it
# sits in the repository, every path inside it is relative, and nothing is fetched from an
# external origin at runtime. So the deploy is an upload, not a build.
#
# The gate before that upload is the repository's own suite. A push that would ship a broken
# game fails here instead of on the player's screen.
name: Pages

on:
  push:
    branches: [main]
  # Runnable on demand from any branch. That verifies a release candidate; it does not publish
  # one - only main deploys, and the `deploy` job below is what enforces that.
  workflow_dispatch:

# Read the repo, mint the Pages token. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run already in flight finishes rather than being cancelled, so a
# half-uploaded artifact never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No npm install: the suite runs on the Node standard library alone. Playwright is a
      # devDependency used by the local visual harness, which is deliberately not part of
      # `npm test` and is not run here.
      #
      # fontTools is the one thing the suite needs beyond Node: tests/assets.cjs reads the
      # shipped woff2's cmap to prove the pixel-font subset covers every character the build can
      # render. Installing it keeps that gate at full strength — the alternative, letting the
      # check skip itself when the module is missing, would turn a real guarantee into a silent
      # pass exactly where it matters, on the runner that publishes the site.
      #
      # The [woff] extra pulls Brotli, which woff2 decoding needs; plain `fonttools` imports
      # fine and then fails on the shipped font.
      - name: Font tooling for the subset-coverage gate
        run: python3 -m pip install --quiet --disable-pip-version-check "fonttools[woff]"
      - name: Test suite
        run: npm test
      - name: Source-derived audit
        run: npm run audit
      # The audit regenerates files it derives from Source. If that changes anything, the
      # committed derivation is stale and the deploy is refused rather than shipping a build
      # whose documentation disagrees with its code.
      - name: Audit output is current
        run: git diff --exit-code

  # PRODUCTION DEPLOY AUTHORITY: main ONLY.
  #
  # `verify` runs wherever it is asked to, which is the point of workflow_dispatch on a WORK
  # branch - a release candidate can be gated without touching the live site. Publishing is the
  # part that is restricted, so the guard is on this job rather than on the trigger: a dispatch
  # from any other ref runs the suite and then skips the deploy.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # UI_UX §BUILD MARKER: the shipped build.js names the commit it was deployed from (the repository copy reads dev).
      # Only this job's checkout is touched, after `verify` passed on the committed tree.
      - name: Stamp the build marker
        run: |
          sed -i "s/commit:'dev'/commit:'${GITHUB_SHA::7}'/" dist/build.js
          grep -q "commit:'${GITHUB_SHA::7}'" dist/build.js
      # dist/ is the site root, so the game is served at the Pages root rather than under /dist.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
